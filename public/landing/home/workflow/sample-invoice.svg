    <text x="70" y="394" font-size="26" font-weight="800">Website refresh</text>
    <rect x="70" y="430" width="820" height="58" rx="9" fill="#e8f5f3"/>
    <text x="94" y="466" font-size="14" font-weight="800" fill="#0f766e">DESCRIPTION</text>
    <text x="648" y="466" text-anchor="end" font-size="14" font-weight="800" fill="#0f766e">QTY</text>
    <text x="758" y="466" text-anchor="end" font-size="14" font-weight="800" fill="#0f766e">RATE</text>
    <text x="866" y="466" text-anchor="end" font-size="14" font-weight="800" fill="#0f766e">AMOUNT</text>
    <text x="94" y="538" font-size="18" font-weight="700">Design and development</text>
    <text x="94" y="566" font-size="14" fill="#64748b">Responsive page design and build</text>
    <text x="648" y="538" text-anchor="end" font-size="17">1</text>
    <text x="758" y="538" text-anchor="end" font-size="17">$1,250.00</text>
    <text x="866" y="538" text-anchor="end" font-size="17" font-weight="700">$1,250.00</text>
    <path d="M70 602H890" stroke="#e2e8f0"/>
    <text x="94" y="656" font-size="18" font-weight="700">Content handoff</text>
    <text x="94" y="684" font-size="14" fill="#64748b">Final copy placement and delivery</text>
    <text x="648" y="656" text-anchor="end" font-size="17">1</text>
    <text x="758" y="656" text-anchor="end" font-size="17">$280.00</text>
    <text x="866" y="656" text-anchor="end" font-size="17" font-weight="700">$280.00</text>
    <path d="M70 725H890" stroke="#cbd5e1" stroke-width="2"/>
    <text x="610" y="776" font-size="16" fill="#64748b">Subtotal</text><text x="890" y="776" text-anchor="end" font-size="17">$1,530.00</text>
    <text x="610" y="816" font-size="16" fill="#64748b">Sales Tax (8%)</text><text x="890" y="816" text-anchor="end" font-size="17">$122.40</text>
    <rect x="585" y="847" width="305" height="70" rx="12" fill="#0f766e"/>
    <text x="610" y="890" font-size="18" font-weight="800" fill="#ffffff">Total</text><text x="866" y="890" text-anchor="end" font-size="24" font-weight="800" fill="#ffffff">$1,652.40</text>
    <text x="610" y="965" font-size="16" fill="#64748b">Payment recorded</text><text x="890" y="965" text-anchor="end" font-size="17">$800.00</text>
    <text x="610" y="1008" font-size="18" font-weight="800">Balance due</text><text x="890" y="1008" text-anchor="end" font-size="22" font-weight="800">$852.40</text>
    <text x="70" y="1076" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748b">NOTES</text>
    <text x="70" y="1110" font-size="16" fill="#475569">Thank you. Please reference INV-2026-014 with your payment.</text>
    <path d="M70 1155H890" stroke="#e2e8f0"/>
    <text x="480" y="1188" text-anchor="middle" font-size="13" fill="#94a3b8">Created with Receipt Cycle · Fictional sample</text>
