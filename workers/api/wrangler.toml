# Receipt Cycle API Worker (replaces the Convex backend). Secrets are set with
# `wrangler secret put <NAME>`; never commit values.
name = "receipt-cycle-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# The API lives on its own subdomain of the live site.
routes = [{ pattern = "api.receiptcycle.com", custom_domain = true }]
# Keep the workers.dev address too, as a backup.
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "receipt-cycle-db"
database_id = "5f160001-46c7-4733-8e51-bd73997589cc"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "receipt-cycle-files"

# Cloudflare Email Sending (sign-in codes, welcome and reset emails). Turned on by setting MAIL_FROM below
# once the domain is enabled with `wrangler email sending enable receiptcycle.com`.
[[send_email]]
name = "EMAIL"

[vars]
PUBLIC_WEB_APP_URL = "https://receiptcycle.com"
# This Worker's own address; Better Auth builds its links from it.
BETTER_AUTH_URL = "https://api.receiptcycle.com"
# Email + password sign-in (no email confirmation needed). Uses fast PBKDF2 hashing so it fits the free plan.
PASSWORD_AUTH_ENABLED = "true"
# Public Google OAuth web client id (safe to commit; it ships in the website anyway).
GOOGLE_WEB_CLIENT_ID = "257702962892-m2m0terd11tbn8049umc5bltp5sjqqr1.apps.googleusercontent.com"
# Browser addresses allowed to call the auth endpoints (the live site, www, and Cloudflare preview versions).
TRUSTED_ORIGINS = "https://www.receiptcycle.com,https://receipt-cycle-ai.komolafebamidele.workers.dev,https://*-receipt-cycle-ai.komolafebamidele.workers.dev"

# Polar (polar.sh) billing. Secrets (set with `wrangler secret put`): POLAR_ACCESS_TOKEN, POLAR_WEBHOOK_SECRET.
POLAR_SERVER = "production"
# Fill these in once the products exist in Polar, then deploy:
# POLAR_ORGANIZATION_ID = ""
# POLAR_ORG_SLUG = ""
# POLAR_MONTHLY_PRODUCT_ID = ""
# POLAR_YEARLY_PRODUCT_ID = ""
# POLAR_FREE_PRODUCT_ID = ""
