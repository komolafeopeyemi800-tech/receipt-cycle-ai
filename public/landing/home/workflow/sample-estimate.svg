<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1220" viewBox="0 0 960 1220" role="img" aria-labelledby="title desc">
  <title id="title">Sample Receipt Cycle estimate</title>
  <desc id="desc">A fictional sent estimate with a validity date, two line items, tax, and a total.</desc>
  <rect width="960" height="1220" rx="24" fill="#ffffff"/>
  <rect width="960" height="18" rx="9" fill="#2563eb"/>
