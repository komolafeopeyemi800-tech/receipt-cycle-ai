    <text x="890" y="94" text-anchor="end" font-size="42" font-weight="800" fill="#0f766e">INVOICE</text>
    <text x="890" y="126" text-anchor="end" font-size="17" fill="#475569">INV-2026-014</text>
    <path d="M70 169H890" stroke="#dbe5ec" stroke-width="2"/>
    <text x="70" y="221" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748b">BILL TO</text>
    <text x="70" y="258" font-size="24" font-weight="800">Sample Client LLC</text>
    <text x="70" y="290" font-size="16" fill="#64748b">123 Example Avenue</text>
    <text x="70" y="316" font-size="16" fill="#64748b">Fairview, USA 10018</text>
    <text x="590" y="221" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748b">ISSUED</text>
    <text x="890" y="221" text-anchor="end" font-size="17" font-weight="700">Oct 17, 2026</text>
    <text x="590" y="258" font-size="14" font-weight="700" letter-spacing="1.4" fill="#64748b">DUE</text>
    <text x="890" y="258" text-anchor="end" font-size="17" font-weight="700">Nov 16, 2026</text>
    <rect x="590" y="283" width="300" height="58" rx="12" fill="#ecfdf5"/>
    <circle cx="618" cy="312" r="7" fill="#10b981"/>
