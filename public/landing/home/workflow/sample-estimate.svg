    <text x="648" y="538" text-anchor="end" font-size="17">1</text>
    <text x="758" y="538" text-anchor="end" font-size="17">$980.00</text>
    <text x="866" y="538" text-anchor="end" font-size="17" font-weight="700">$980.00</text>
    <path d="M70 602H890" stroke="#e2e8f0"/>
