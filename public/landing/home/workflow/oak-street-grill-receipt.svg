<svg xmlns="http://www.w3.org/2000/svg" width="520" height="940" viewBox="0 0 520 940" role="img" aria-labelledby="title desc">
  <title id="title">Sample Oak Street Grill receipt</title>
  <desc id="desc">A fictional restaurant receipt totaling twenty-one dollars and seventy cents.</desc>
  <defs>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#0b2239" flood-opacity=".16"/>
    </filter>
    <pattern id="grain" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M2 4h3M11 12h2M6 15h1" stroke="#64748b" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <path d="M37 26h446v850l-12 12-12-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12V26Z" fill="#fffef9" filter="url(#paper)"/>
  <path d="M37 26h446v850l-12 12-12-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12-13 12-13-12V26Z" fill="url(#grain)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#17212b">
    <text x="260" y="92" text-anchor="middle" font-size="28" font-weight="700" letter-spacing="2">OAK STREET GRILL</text>
    <text x="260" y="124" text-anchor="middle" font-size="15">118 Oak Street</text>
    <text x="260" y="148" text-anchor="middle" font-size="15">Fairview, USA 10018</text>
    <text x="260" y="172" text-anchor="middle" font-size="15">Illustrative sample receipt</text>
    <path d="M77 205H443" stroke="#59636d" stroke-width="1.5" stroke-dasharray="7 7"/>
    <text x="77" y="240" font-size="16">OCT 17, 2026</text>
    <text x="443" y="240" text-anchor="end" font-size="16">12:42 PM</text>
    <text x="77" y="274" font-size="14">CHECK 0084</text>
    <text x="443" y="274" text-anchor="end" font-size="14">TABLE 12</text>
    <path d="M77 301H443" stroke="#59636d" stroke-width="1.5" stroke-dasharray="7 7"/>
    <g font-size="16">
      <text x="77" y="347">1  GRILLED CHICKEN SANDWICH</text><text x="443" y="347" text-anchor="end">10.49</text>
      <text x="77" y="389">1  SEASONED FRIES</text><text x="443" y="389" text-anchor="end">4.29</text>
      <text x="77" y="431">1  ICED TEA</text><text x="443" y="431" text-anchor="end">2.49</text>
    </g>
    <path d="M77 469H443" stroke="#59636d" stroke-width="1.5" stroke-dasharray="7 7"/>
    <g font-size="17">
      <text x="218" y="515">SUBTOTAL</text><text x="443" y="515" text-anchor="end">17.27</text>
      <text x="218" y="554">SALES TAX</text><text x="443" y="554" text-anchor="end">1.43</text>
      <text x="218" y="593">TIP</text><text x="443" y="593" text-anchor="end">3.00</text>
    </g>
    <path d="M218 620H443" stroke="#17212b" stroke-width="2"/>
    <text x="218" y="665" font-size="23" font-weight="700">TOTAL</text>
    <text x="443" y="665" text-anchor="end" font-size="23" font-weight="700">$21.70</text>
    <text x="77" y="721" font-size="15">VISA •••• 2841</text>
    <text x="443" y="721" text-anchor="end" font-size="15">APPROVED</text>
    <path d="M77 754H443" stroke="#59636d" stroke-width="1.5" stroke-dasharray="7 7"/>
    <text x="260" y="806" text-anchor="middle" font-size="18" font-weight="700">THANK YOU</text>
    <text x="260" y="838" text-anchor="middle" font-size="14">Please keep this receipt for your records.</text>
  </g>
</svg>
