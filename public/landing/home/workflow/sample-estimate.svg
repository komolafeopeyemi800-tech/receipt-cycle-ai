    <text x="610" y="776" font-size="16" fill="#64748b">Subtotal</text><text x="890" y="776" text-anchor="end" font-size="17">$1,220.00</text>
    <text x="610" y="816" font-size="16" fill="#64748b">Sales Tax (8%)</text><text x="890" y="816" text-anchor="end" font-size="17">$97.60</text>
