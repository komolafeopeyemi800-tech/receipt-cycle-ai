<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1220" viewBox="0 0 960 1220" role="img" aria-labelledby="title desc">
  <title id="title">Sample Receipt Cycle invoice</title>
  <desc id="desc">A fictional partially paid invoice with two line items and an outstanding balance.</desc>
  <rect width="960" height="1220" rx="24" fill="#ffffff"/>
  <rect width="960" height="18" rx="9" fill="#0f766e"/>
  <g font-family="Inter, Arial, sans-serif" fill="#102a43">
